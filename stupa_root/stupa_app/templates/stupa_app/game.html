<!doctype html>
<html>
    <head>
        <title>Tower of Hanoi</title>
        <style>
         table {
             border-collapse: collapse;
         }

         th, td {
             width: 120px;
             height: 30px;
             text-align: center;
             vertical-align: middle;
         }

         th {
             font-weight: bold;
         }

         .disk {
             height: 20px;
             margin: 0 auto;
             border-radius: 4px;
         }
         .disk-1 { width: 30%; background-color: #4CAF50; }
         .disk-2 { width: 45%; background-color: #8BC34A; }
         .disk-3 { width: 60%; background-color: #2196F3; }
         .disk-4 { width: 75%; background-color: #FF9800; }
         .disk-5 { width: 90%; background-color: #f44336; }
        </style>
    </head>
    <body>

        <h1>Tower of Hanoi</h1>

        <table>

            <tr>
                <th>Peg A</th>
                <th>Peg B</th>
                <th>Peg C</th>
            </tr>

            {% for row in pegs %}
            <tr>
                {% for cell in row %}
                <td>
                    {% if cell is not none %}
                    <div class="disk"
                         style="width: {{ cell|add:2 }}0%;
                                background-color: hsl({{ cell|add:2 }}0, 70%, 50%);">
                    </div>
                    {% else %}
                    <div></div>
                    {% endif %}
                </td>
                {% endfor %}
            </tr>
            {% endfor %}

        </table>
        {% if solved %}
        <h1>Solved</h1>
        <form method="post">
            {% csrf_token %}
            <button name="action" value="restart">Restart</button>
        </form>
        {% else %}
        <form id="auto-next-form" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="next">
        </form>
        {% endif %}

    <script>
     const delay = {{ delay|default:1000 }};
     setTimeout(function () {
         document.getElementById("auto-next-form").submit();
     }, delay);
    </script>
    </body>
</html>
