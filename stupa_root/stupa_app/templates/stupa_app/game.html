{% load math_filters %}
<!doctype html>
<html>
    <head>
        <title>Tower of Hanoi</title>
        <style>
         table {
             border-collapse: collapse;
         }

         th, td {
             width: 120px;
             height: 30px;
             text-align: center;
             vertical-align: middle;
         }

         th {
             font-weight: bold;
         }

         .disk {
             height: 20px;
             margin: 4px 0;
             border-radius: 4px;
         }

         .board {
             display: flex;
             justify-content: space-around;
             align-items: flex-end;
             height: 300px;
             margin-top: 40px;
         }

         .peg {
             display: flex;
             flex-direction: column-reverse;
             align-items: center;
             width: 120px;
             height: 100%;
             border-left: 4px solid #444;
             border-right: 4px solid #444;
         }
         {% for disk, style in disk_styles.items %}
         .disk-{{ disk }} {
             width: {{ style.width }}%;
             background-color: hsl({{ style.hue }}, 70%, 50%);
         }
         {% endfor %}

        </style>
    </head>
    <body>

        <h1>Tower of Hanoi</h1>

        <table>
            <div class="board">
                {% for peg in pegs %}
                <div class="peg">
                    {% for disk in peg %}
                    {% with style=disk_styles|get_item:disk %}
                    <div class="disk"
                         style="width: {{ style.width }}%;
                                background-color: hsl({{ style.hue }}, 70%, 50%);">
                    </div>
                    {% endwith %}
                    {% endfor %}
                </div>
                {% endfor %}
            </div>

        </table>
        <pr>Moves: {{ nmoves }}/{{ delta|floatformat:2 }}</pr>
        {% if solved %}
        <h1>Solved</h1>
        {% endif %}
        
        <form id="game-form" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" id="action-input" value="next">

            <button type="submit" id="next-btn">Next</button>
            <button type="button" id="cancel-btn">Cancel</button>
            <button type="submit" id="restart-btn" name="action" value="restart" style="display:none;">
                Restart
            </button>
        </form>

        <script>
         const delay = {{ delay|default:1000 }};
         let intervalId = null;
         
         function startLoop() {
             intervalId = setInterval(function () {
                 document.getElementById("game-form").submit();
             }, delay);
         }

         function stopLoop() {
             if (intervalId !== null) {
                 clearInterval(intervalId);
                 intervalId = null;
             }
             
             document.getElementById("next-btn").style.display = "none";
             document.getElementById("cancel-btn").style.display = "none";
             document.getElementById("restart-btn").style.display = "inline-block";
         }

         document.getElementById("cancel-btn").addEventListener("click", stopLoop);
         
         // Start automatically if not solved
         {% if not solved %}
         startLoop();
         {% endif %}
        </script>
    </body>
</html>
