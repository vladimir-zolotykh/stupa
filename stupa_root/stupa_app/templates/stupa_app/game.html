{% load math_filters %}
<!doctype html>
<html>
    <head>
        <title>Tower of Hanoi</title>
        <style>
         table {
             border-collapse: collapse;
         }

         th, td {
             width: 120px;
             height: 30px;
             text-align: center;
             vertical-align: middle;
         }

         th {
             font-weight: bold;
         }

         .disk {
             height: 20px;
             margin: 4px 0;
             border-radius: 4px;
         }

         .board {
             display: flex;
             justify-content: space-around;
             align-items: flex-end;
             height: 300px;
             margin-top: 40px;
         }

         .peg {
             display: flex;
             flex-direction: column-reverse;
             align-items: center;
             width: 120px;
             height: 100%;
             border-left: 4px solid #444;
             border-right: 4px solid #444;
         }
         {% for disk, style in disk_styles.items %}
         .disk-{{ disk }} {
             width: {{ style.width }}%;
             background-color: hsl({{ style.hue }}, 70%, 50%);
         }
         {% endfor %}

        </style>
    </head>
    <body>

        <h1>Tower of Hanoi</h1>

        <table>
            <div class="board">
                {% for peg in pegs %}
                <div class="peg">
                    {% for disk in peg %}
                    {% with style=disk_styles|get_item:disk %}
                    <div class="disk"
                         style="width: {{ style.width }}%;
                                background-color: hsl({{ style.hue }}, 70%, 50%);">
                    </div>
                    {% endwith %}
                    {% endfor %}
                </div>
                {% endfor %}
            </div>

        </table>
        <pr>Moves: {{ nmoves }}/{{ delta }}</pr>
        {% if solved %}
        <h1>Solved</h1>
        <form method="post">
            {% csrf_token %}
            <button name="action" value="restart">Restart</button>
        </form>
        {% else %}
        <form id="auto-next-form" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="next">
        </form>
        {% endif %}

    <script>
     const delay = {{ delay|default:1000 }};
     setTimeout(function () {
         document.getElementById("auto-next-form").submit();
     }, delay);
    </script>
    </body>
</html>
