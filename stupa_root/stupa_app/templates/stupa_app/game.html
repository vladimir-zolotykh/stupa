<!doctype html>
<html>
    <head>
        <title>Tower of Hanoi</title>
        <style>
         table {
             border-collapse: collapse;
         }

         th, td {
             width: 120px;
             height: 30px;
             text-align: center;
             vertical-align: middle;
         }

         th {
             font-weight: bold;
         }

         .disk {
             border: 1px solid #000;
             width: 80%;
             margin: 0 auto;
         }
        </style>
    </head>
    <body>

        <h1>Tower of Hanoi</h1>

        <table>

            <tr>
                <th>Peg A</th>
                <th>Peg B</th>
                <th>Peg C</th>
            </tr>

            {% for row in pegs %}
            <tr>
                {% for cell in row %}
                <td>
                    {% if cell is none %}
                    <div class="disk">&nbsp;</div>
                    {% else %}
                    <div class="disk">{{ cell }}</div>
                    {% endif %}
                </td>
                {% endfor %}
            </tr>
            {% endfor %}

        </table>
        {% if solved %}
        <h1>Solved</h1>
        <form method="post">
            {% csrf_token %}
            <button name="action" value="restart">Restart</button>
        </form>
        {% else %}
        <form id="auto-next-form" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="next">
        </form>
        {% endif %}

    <script>
     const delay = {{ delay|default:1000 }};
     setTimeout(function () {
         document.getElementById("auto-next-form").submit();
     }, delay);
    </script>
    </body>
</html>
